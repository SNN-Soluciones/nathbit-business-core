server:
  port: 8082
  servlet:
    context-path: /v2/api/business

spring:
  application:
    name: nathbit-business-core

  datasource:
    url: jdbc:postgresql://localhost:5432/nathbitpos_v3
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/nathbit_audit
      auto-index-creation: true

jwt:
  secret: your-secret-key-change-this-in-production
  device-token:
    expiration: 86400000  # 24 horas
  bearer-token:
    expiration: 3600000   # 1 hora


storage:
  spaces:
    access-key: DO00R4XNBR36TTF3W8NV
    secret-key: oYIJeiIPUMsdMSePeOgR4SA3RijgfW6JeVChNKjifOA
